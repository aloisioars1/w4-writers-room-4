name: Android CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
  FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
  FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      - name: Grant Execute Permission for Gradlew & Ensure Wrapper JAR
        run: |
          chmod +x gradlew
          echo "Verificando integridade do wrapper..."
          ls -lh gradle/wrapper/
          # Se o JAR não for um ZIP válido ou não tiver a Main, baixa o oficial
          if ! unzip -t gradle/wrapper/gradle-wrapper.jar > /dev/null 2>&1 || ! jar tf gradle/wrapper/gradle-wrapper.jar | grep -q "GradleWrapperMain"; then
            echo "⚠️ JAR corrompido ou inválido detectado! Baixando oficial 8.6..."
            rm -f gradle/wrapper/gradle-wrapper.jar
            curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.6.0/gradle/wrapper/gradle-wrapper.jar
            echo "✅ JAR oficial baixado: $(ls -lh gradle/wrapper/gradle-wrapper.jar)"
          else
            echo "✅ JAR íntegro: $(ls -lh gradle/wrapper/gradle-wrapper.jar)"
          fi

      - name: Decode Release Keystore (App Signing)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          echo "Keystore decodificado com sucesso"

      - name: Run Unit Tests
        run: ./gradlew test --continue
        continue-on-error: true

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Build Release APK
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease

      - name: Build Release AAB (Android App Bundle)
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: ./gradlew bundleRelease

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Release APK Artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Release AAB Artifact
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Set up Node.js 20
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy AAB to Firebase App Distribution
        if: ${{ env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != '' }}
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute app/build/outputs/bundle/release/app-release.aab --app $FIREBASE_APP_ID --token $FIREBASE_TOKEN --groups testers

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/

      - name: Post Set up Gradle
        if: always()
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
      - name: Deploy AAB to Firebase App Distribution
        if: env.FIREBASE_APP_ID != '' && env.FIREBASE_TOKEN != ''
        run: |
          npm install -g firebase-tools
          firebase appdistribution:distribute app/build/outputs/bundle/release/app-release.aab --app "$FIREBASE_APP_ID" --testers "dev-team@example.com, qa@example.com" --release-notes "Nova versão automatizada via CI/CD"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
