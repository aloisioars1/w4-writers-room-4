name: Android CI - AI Studio Final
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      STORE_PASSWORD: "android123"
      KEY_PASSWORD: "android123"
      KEYSTORE_PATH: "my-upload-key.jks"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Criar arquivos que o AI Studio esqueceu
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then cp .env.example .env; fi
          PACKAGE=$(grep -oP 'applicationId = "\K[^"]+' app/build.gradle.kts | head -1)
          mkdir -p app
          cat > app/google-services.json <<EOF
          {
            "project_info": { "project_number": "1234567890", "project_id": "fake-ci", "storage_bucket": "fake-ci.appspot.com" },
            "client": [{ "client_info": { "mobilesdk_app_id": "1:1234567890:android:abc", "android_client_info": { "package_name": "$PACKAGE" } }, "oauth_client": [], "api_key": [{ "current_key": "AIzaSyFakeKeyForCI1234567890ABC" }], "services": { "appinvite_service": { "other_platform_oauth_client": [] } } }],
            "configuration_version": "1"
          }
          EOF
          if [ ! -f "debug.keystore" ]; then keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Debug" -noprompt; fi
          if [ ! -f "my-upload-key.jks" ]; then keytool -genkey -v -keystore my-upload-key.jks -alias upload -storepass android123 -keypass android123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Upload" -noprompt; fi
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.3.1
      - name: Forçar wrapper 9.3.1
        run: |
          if [ ! -f "./gradlew" ]; then gradle wrapper --gradle-version 9.3.1; fi
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip|' gradle/wrapper/gradle-wrapper.properties
          chmod +x ./gradlew
      - run: ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
